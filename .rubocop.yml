AllCops:
  NewCops: enable
  SuggestExtensions: false
  TargetRubyVersion: 3.2

Bundler/DuplicatedGem:
  Enabled: false

# Specs define example classes inside describe blocks and pass
# deliberately empty callback blocks
Lint/ConstantDefinitionInBlock:
  Exclude:
    - 'spec/**/*'

Lint/EmptyBlock:
  Exclude:
    - 'spec/**/*'

# Enforce outdenting of access modifiers (i.e. public, private, protected)
Layout/AccessModifierIndentation:
  EnforcedStyle: outdent

# Indentation of when/else
Layout/CaseIndentation:
  EnforcedStyle: end
  IndentOneStep: false

# Allow dots at the end of lines
Layout/DotPosition:
  EnforcedStyle: trailing

Layout/EmptyLinesAroundAccessModifier:
  Enabled: true

# Align ends correctly
Layout/EndAlignment:
  EnforcedStyleAlignWith: variable

Layout/LineLength:
  Enabled: false

Layout/MultilineOperationIndentation:
  EnforcedStyle: indented

# No spaces inside hash literals
Layout/SpaceInsideHashLiteralBraces:
  EnforcedStyle: no_space

Metrics/AbcSize:
  Enabled: false

Metrics/BlockLength:
  Enabled: false

# Avoid more than `Max` levels of nesting.
Metrics/BlockNesting:
  Max: 2

Metrics/ClassLength:
  Max: 100

Metrics/MethodLength:
  CountComments: false
  Max: 53

# Avoid long parameter lists
Metrics/ParameterLists:
  Max: 4
  CountKeywordArgs: true

# The backend API mirrors ActiveRecord semantics, where methods like
# save and lock_exclusively! return booleans without a ? suffix
Naming/PredicateMethod:
  Enabled: false

Security/YAMLLoad:
  Enabled: false

Style/Alias:
  EnforcedStyle: prefer_alias_method

# Align with the style guide.
Style/CollectionMethods:
  PreferredMethods:
    collect:  'map'
    collect!: 'map!'
    reduce:   'inject'
    find:     'detect'
    find_all: 'select'

# Disable documentation checking until a class needs to be documented once
Style/Documentation:
  Enabled: false

Style/DoubleNegation:
  Enabled: false

Style/FrozenStringLiteralComment:
  Enabled: false

# Enforce Ruby 1.8-compatible hash syntax
Style/HashSyntax:
  EnforcedStyle: hash_rockets

Style/Lambda:
  Enabled: false

Style/NumericPredicate:
  Enabled: false

# The ext files monkey-patch third-party classes and necessarily reopen
# several of them; the spec support files define collections of small
# fixture classes
Style/OneClassPerFile:
  Exclude:
    - 'lib/delayed/psych_ext.rb'
    - 'lib/delayed/syck_ext.rb'
    - 'spec/helper.rb'
    - 'spec/sample_jobs.rb'

Style/PercentLiteralDelimiters:
  PreferredDelimiters:
    '%':  ()
    '%i': ()
    '%q': ()
    '%Q': ()
    '%r': '{}'
    '%s': ()
    '%w': '[]'
    '%W': '[]'
    '%x': ()

Style/RaiseArgs:
  EnforcedStyle: exploded

Style/RegexpLiteral:
  Enabled: false

Style/RescueModifier:
  Enabled: false

Style/SafeNavigation:
  Enabled: false

Style/SignalException:
  EnforcedStyle: only_raise

Style/SymbolArray:
  Enabled: false

Style/SymbolProc:
  Enabled: false

Style/TrailingCommaInArguments:
  Enabled: false

Style/TrailingCommaInArrayLiteral:
  Enabled: false

Style/TrailingCommaInHashLiteral:
  Enabled: false

Style/ZeroLengthPredicate:
  Enabled: false
