name: CI

on:
  push:
    branches: [ master ]
  # run on every PR
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    name: Test (Ruby ${{ matrix.ruby }}, Rails ${{ matrix.rails_version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        ruby: ['3.3', '3.4', '4.0', head]
        rails_version:
          - '7.2.0'
          - '8.0.0'
          - '8.1.0'
          - 'edge'
        include:
          # JRuby: activerecord-jdbcsqlite3-adapter supports Rails 7.2 (72.x),
          # and Rails 8.0 only via its 80.0.pre1 prerelease. JRuby 10.1 removed
          # the Java APIs 72.x was compiled against (see the Gemfile).
          - ruby: jruby-10.0
            rails_version: '7.2.0'
          - ruby: jruby-10.1
            rails_version: '8.0.0'
          - ruby: jruby-head
            rails_version: '8.0.0'
          # TruffleRuby (parallel threads, as on JRuby; native sqlite3)
          - ruby: truffleruby
            rails_version: '8.1.0'
          - ruby: truffleruby-head
            rails_version: '8.1.0'

    continue-on-error: ${{ matrix.rails_version == 'edge' || endsWith(matrix.ruby, 'head') }}
    timeout-minutes: 30

    env:
      RAILS_VERSION: ${{ matrix.rails_version }}

    steps:
    - uses: actions/checkout@v7
    - uses: ruby/setup-ruby@v1
      with:
        ruby-version: ${{ matrix.ruby }}
        bundler-cache: true # runs 'bundle install' and caches installed gems automatically
    - name: Run tests
      run: bundle exec rake compile && bundle exec rspec
    - name: Coveralls Parallel
      uses: coverallsapp/github-action@v2
      with:
        github-token: ${{ secrets.github_token }}
        flag-name: run-${{ matrix.ruby }}-${{ matrix.rails_version }}
        parallel: true
        fail-on-error: false # coverage must not fail the build

  finish:
    needs: test
    if: ${{ always() }}
    runs-on: ubuntu-latest
    steps:
    - name: Coveralls Finished
      uses: coverallsapp/github-action@v2
      with:
        github-token: ${{ secrets.github_token }}
        parallel-finished: true
        fail-on-error: false
