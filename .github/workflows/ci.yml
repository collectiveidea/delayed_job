name: CI

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

jobs:
  test:
    name: Test (Ruby ${{ matrix.ruby }}, Rails ${{ matrix.rails_version }})
    runs-on: ubuntu-${{ matrix.ubuntu }}
    strategy:
      fail-fast: false
      matrix:
        ruby: ['3.2', '3.3', '3.4', '4.0', jruby-10.0, jruby-head, ruby-head]
        rails_version:
          - '7.0.0'
          - '7.1.0'
          - '7.2.0'
          - '8.0.0'
          - '8.1.0'
          - 'edge'
        ubuntu: [latest]
        exclude:
          # Rails edge requires Ruby >= 3.3.1
          - ruby: '3.2'
            rails_version: 'edge'
          # activerecord-jdbcsqlite3-adapter supports Rails 8.0 at most,
          # and only via its 80.0.pre1 prerelease
          - ruby: jruby-10.0
            rails_version: '8.1.0'
          - ruby: jruby-10.0
            rails_version: 'edge'
          - ruby: jruby-head
            rails_version: '8.1.0'
          - ruby: jruby-head
            rails_version: 'edge'
        include:
          # EOL Active Record still supported on Ruby >= 3.2
          - ruby: '3.2'
            rails_version: '6.0.0'
            ubuntu: '22.04'
          - ruby: '3.2'
            rails_version: '6.1.0'
            ubuntu: '22.04'

    continue-on-error: ${{ matrix.rails_version == 'edge' || endsWith(matrix.ruby, 'head') }}

    steps:
    - uses: actions/checkout@v4
    - uses: ruby/setup-ruby@v1
      env:
        RAILS_VERSION: ${{ matrix.rails_version }}
      with:
        ruby-version: ${{ matrix.ruby }}
        bundler-cache: true # runs 'bundle install' and caches installed gems automatically
    - name: Run tests
      env:
        RAILS_VERSION: ${{ matrix.rails_version }}
      run: bundle exec rspec
    - name: Coveralls Parallel
      uses: coverallsapp/github-action@main
      with:
        github-token: ${{ secrets.github_token }}
        flag-name: run-${{ matrix.ruby }}-${{ matrix.rails_version }}
        parallel: true
        # Don't fail otherwise-green jobs when coveralls.io has an outage
        fail-on-error: false

  finish:
    needs: test
    runs-on: ubuntu-latest
    steps:
    - name: Coveralls Finished
      uses: coverallsapp/github-action@main
      with:
        github-token: ${{ secrets.github_token }}
        parallel-finished: true
        fail-on-error: false
